name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Dry scaffolding — wire CLOUDFLARE_API_TOKEN + account ID before enabling real deploys.
  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: OpenNext build
        working-directory: apps/web
        run: bun run build:worker
      - name: Wrangler dry-run
        working-directory: apps/web
        run: bunx wrangler deploy -c cloudflare/app-worker/wrangler.jsonc --dry-run --env=""
