name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: OpenNext worker build
        working-directory: apps/web
        run: bun run build:worker
      - name: Wrangler dry-run
        working-directory: apps/web
        run: bunx wrangler deploy -c cloudflare/app-worker/wrangler.jsonc --dry-run --env=""
